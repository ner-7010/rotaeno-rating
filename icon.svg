<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Navy to Void) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144973"/>
      <stop offset="60%" stop-color="#0d2b45"/>
      <stop offset="100%" stop-color="#061524"/>
    </linearGradient>

    <!-- Subtle Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0077cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Arc Gradient -->
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0077cc"/>
    </linearGradient>

    <!-- Gold Arc Gradient -->
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="60%" stop-color="#ffa751"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Icon Rounded Rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Border Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5"/>

  <!-- Outer Steering Track (Thin Dashed Circle) -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(0, 210, 255, 0.22)" stroke-width="2" stroke-dasharray="6 14"/>

  <!-- Crosshair / Aiming Notches -->
  <line x1="256" y1="46" x2="256" y2="62" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="450" x2="256" y2="466" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="256" x2="62" y2="256" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <line x1="450" y1="256" x2="466" y2="256" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Judgment Ring (Subtle Base Circle) -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Dynamic Smooth Arcs (Clean Spin Motion) -->
  <g filter="url(#neonGlow)">
    <!-- Primary Arc (Top to Right: Cyan) -->
    <path d="M 230 108 A 148 148 0 0 1 404 256" fill="none" stroke="url(#cyanArc)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="404" cy="256" r="7" fill="#ffffff"/>

    <!-- Counter Arc (Bottom to Left: Gold) -->
    <path d="M 282 404 A 148 148 0 0 1 108 256" fill="none" stroke="url(#goldArc)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="108" cy="256" r="7" fill="#ffffff"/>
  </g>

  <!-- Gyroscope / Center Core -->
  <circle cx="256" cy="256" r="46" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <circle cx="256" cy="256" r="24" fill="#0d2b45" stroke="#00f2fe" stroke-width="2.5"/>
  <!-- Center Core Diamond -->
  <polygon points="256,242 270,256 256,270 242,256" fill="url(#goldArc)"/>
</svg>